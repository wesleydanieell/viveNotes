<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <!-- Monochrome interpretation of the original ViveNotes notebook and pen.
       White becomes the Android 13+ themed foreground; black is knocked out. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Three stacked pages under a large folded front sheet. -->
    <path stroke-width="2" d="M25 80 Q26 89 37 90 H75 Q87 90 89 78"/>
    <path stroke-width="2.5" d="M23 76 Q24 85 35 86 H76 Q88 86 90 74"/>
    <path stroke-width="3.3" d="M27 20 H73 Q88 20 88 35 V66 Q88 73 82 78 L73 86 H32 Q22 86 22 76 V34 Q22 20 27 20 Z"/>
    <!-- Turned-up bottom-right page corner, characteristic of the reference. -->
    <path stroke-width="2.5" d="M67 85 Q73 82 73 76 Q74 69 80 68 Q86 67 88 63"/>
    <path stroke-width="1.7" d="M73 86 Q82 85 87 77"/>
    <!-- The three black ring-binder loops. -->
    <path stroke-width="4.8" d="M19 36 Q17 33 20 32 Q22 31 25 33 L29 34 Q32 36 29 38 Q27 40 24 38 L20 37"/>
    <path stroke-width="4.8" d="M19 49 Q17 46 20 45 Q22 44 25 46 L29 47 Q32 49 29 51 Q27 53 24 51 L20 50"/>
    <path stroke-width="4.8" d="M19 62 Q17 59 20 58 Q22 57 25 59 L29 60 Q32 62 29 64 Q27 66 24 64 L20 63"/>
    <!-- Subtle ruled lines and short header line. -->
    <path stroke-width="1.35" d="M46 36 H59 M35 42 H69 M35 50 H69 M35 58 H68 M35 66 H64 M35 74 H56"/>
  </g>
  <!-- A barrel pen inclined ~25 degrees: rounded cap, button, two blue rings,
       tapered nib. The original colors become negative-space detailing. -->
  <g transform="rotate(25 60 51)">
    <path fill="#fff" d="M56 27 C56 23 58.4 21 62 21 C65.6 21 68 23 68 27 V66 L62 78 L56 66 Z"/>
    <path fill="#000" d="M57 28 H67 V30 H57 Z M56 61 H68 V63 H56 Z"/>
    <path fill="none" stroke="#000" stroke-width="1.4" d="M57 34 H67"/>
    <!-- Long inset control button. -->
    <rect x="59.9" y="41" width="4.2" height="14" rx="2.1" fill="#000"/>
    <path fill="#fff" d="M60.8 42.8 V53.3 Q60.8 54 61.5 54 H62.1 Q62.8 54 62.8 53.3 V42.8 Q62.8 42 62.1 42 H61.5 Q60.8 42 60.8 42.8 Z"/>
    <!-- Grip, conical metal nib and the writing point. -->
    <path fill="none" stroke="#000" stroke-width="1.5" d="M57 65 H67 M58.3 69 H65.7"/>
    <path fill="#000" d="M60.5 75.5 L62 81.5 L63.5 75.5 Z"/>
  </g>
</svg>