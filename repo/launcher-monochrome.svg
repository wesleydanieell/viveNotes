<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <!-- Editable source for Android's themed launcher icon. White carries alpha; the launcher supplies color. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stacked sheets and the characteristic curled bottom-right corner. -->
    <path stroke-width="2.8" d="M38 28 H70 Q79 28 79 37 V69 Q79 79 70 80 H37 Q30 80 30 73 V36 Q30 28 38 28 Z"/>
    <path stroke-width="2" d="M74 51 V70 Q74 75 69 75 H39"/>
    <path stroke-width="2" d="M63 80 Q69 78 70 71 Q75 72 79 68"/>
    <!-- Left spiral binding, protruding beyond the page. -->
    <path stroke-width="3.6" d="M27 40 Q27 37 31 37 H36 Q39 37 39 40 Q39 43 36 43 H31"/>
    <path stroke-width="3.6" d="M27 51 Q27 48 31 48 H36 Q39 48 39 51 Q39 54 36 54 H31"/>
    <path stroke-width="3.6" d="M27 62 Q27 59 31 59 H36 Q39 59 39 62 Q39 65 36 65 H31"/>
    <!-- Ruled notebook lines remain visible behind the pen. -->
    <path stroke-width="1.8" d="M43 42 H61 M43 50 H57 M43 58 H54 M43 66 H50"/>
  </g>
  <!-- Diagonal fountain pen: tip down-left, cap up-right, accent and grip. -->
  <g transform="rotate(27 62 54)">
    <path fill="#fff" d="M57.8 33 Q57.8 29 61.5 29 H64.5 Q68.2 29 68.2 33 V66 L63 75.5 L57.8 66 Z"/>
    <path fill="none" stroke="#000" stroke-width="1.8" d="M58.6 38 H67.4 M58.6 57 H67.4 M58.6 62 H67.4"/>
    <path fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" d="M65.3 40 V50"/>
    <path fill="#000" d="M61.5 70 L63 75.5 L64.5 70 Z"/>
    <path fill="none" stroke="#fff" stroke-width="1.4" d="M63 76 V80"/>
  </g>
</svg>